<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Info</title>
    <script type="text/javascript">
        var loadError=false;
    </script>
    <link onerror="loadError=true" rel="stylesheet" href="/lib/bstrap/css/bstrap.css" />
    <link onerror="loadError=true" rel="stylesheet" href="/css/site.css" />
    <style type="text/css">
        body {
            background: transparent;
            margin: 0px;
            padding: 0px;
        }
        table {
            border-collapse: collapse; 
            border-spacing: 0; 
            margin: 0;
        }
        .dl-horizontal dt {
            float: left;
            width: 70px;
            clear: left;
            text-align: left;
            margin-left: 10px;
            margin-bottom: 3px;
        }
        .dl-horizontal dd {
            margin-left: 10px;
        }
    </style>
</head>
<body onload="checkLoadError()">
    <div class="panel-body">
        <dl class="dl-horizontal">
            <dt>Version</dt>
            <dd>%0                        </dd>
            <dt>Build</dt>
            <dd>%1                        </dd>
            <dt>IP</dt>
            <dd>%2                   </dd>
            <dt>MAC</dt>
            <dd>%3                   </dd>
            <dt>Time</dt>
            <dd id="timeValue"></dd>
        </dl>
    </div>
    <script type="text/javascript">
        var time=%4                                   ;
        function checkLoadError() {
            if (loadError)
                location.replace(document.location.pathname);
        }
        function showTime() {
            var timeElement = document.getElementById("timeValue");
            if (timeElement) {
                var date = new Date(time * 1000);
                timeElement.textContent = %5                                                                                                                                                                                                        ;
            }
            setTimeout(function() { time++; showTime(); }, 1000);
        }
        showTime();
    </script>
</body>
</html>
